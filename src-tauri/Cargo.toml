[workspace]
resolver = "2"
members = ["eco-audio"]
default-members = [".", "eco-audio"]
exclude = ["../third-party/rusty_mp3-1.1.0"]

[package]
name = "recorder_mic"
version = "0.1.0"
description = "Eco: grabadora de micrófono y audio del sistema"
license = "MIT"
repository = "https://github.com/EndingVE/Eco-Windows-Recorder"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "recorder_mic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eco-audio = { path = "eco-audio" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
# Incrusta el frontend (../ui) en el exe; sin esto tauri busca un devUrl.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
